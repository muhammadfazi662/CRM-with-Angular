<div class="container m-0">

    <h2 mat-dialog-title>Add Company</h2>


    <mat-dialog-content>
        <form>
            <!-- Row 1 -->
            <div class="row">

                <div class="col-12 mb-3 col-md-6 mb-md-0">

                    <label for="cname" class="form-label">
                        Company Name
                    </label>

                    <input type="text" class="form-control" placeholder="Enter Company Name" id="cname">

                </div>


                <div class="col-12 mb-3 col-md-6 mb-md-0">

                    <label for="companyType" class="form-label">
                        Select Company Type
                    </label>

                    <select class="form-select" id="companyType">

                        <option selected>Choose...</option>
                        <option value="1">Pesticide</option>
                        <option value="2">Fertilizer</option>
                        <option value="3">Seed</option>

                    </select>

                </div>

            </div>


            <!-- Row 2 -->
            <div class="row mt-3">

                <div class="col-sm-12 mb-3 col-md-6 mb-md-0">

                    <label for="companyNo" class="form-label">
                        Company No
                    </label>

                    <input type="number" class="form-control" placeholder="Enter Company Number" id="companyNo">

                </div>


                <div class="col-sm-12 mb-3 col-md-6 mb-md-0">

                    <label for="companyAddress" class="form-label">
                        Company Address
                    </label>

                    <input type="text" class="form-control" placeholder="Enter Company Address" id="companyAddress">

                </div>

            </div>
             <!-- Row 3 -->
            <div class="row mt-3">

                <div class="col-sm-12 mb-3 col-md-6 mb-md-0">

                    <label for="companysaleOfficer" class="form-label">
                        Company Sale Officer Name
                    </label>

                    <input type="number" class="form-control" placeholder="Enter SaleOfficer Name" id="companysaleOfficer">

                </div>


                <div class="col-sm-12 mb-3 col-md-6 mb-md-0">

                    <label for="SalesofficerNo" class="form-label">
                        SaleOfficer No
                    </label>

                    <input type="text" class="form-control" placeholder="Enter SaleOfficer No" id="SalesofficerNo">

                </div>

            </div>
        </form>
    </mat-dialog-content>


    <mat-dialog-actions>
        <!-- Buttons -->
        <div class="d-flex justify-content-end mt-4">

            <button type="button" class="btn btn-secondary" (click)="closeDialog()">

                Close

            </button>

            <button type="button" class="btn btn-success ms-2">

                Save

            </button>

        </div>
    </mat-dialog-actions>





</div>
