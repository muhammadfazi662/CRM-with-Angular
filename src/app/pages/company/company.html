<div class="container">
    <div class="row">
        <div class="col-md-12 d-flex justify-content-end mt-3">
           <div class="input-group w-25 me-1">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" placeholder="Search Comapny">
           </div>
            <button type="button" class="btn btn-success  text-white" (click)="openComapnyDialog()"><i class="bi bi-plus"></i>Add Comapny</button>
        </div>
    </div>
</div>
<div class="container mt-5">
     <ag-grid-angular
        [rowData]="rowData"
        [columnDefs]="columnDefs"
        style="width: 100%; height: 500px;">
    </ag-grid-angular>
</div>
