<div class="container">

    <!-- <h5 class="mb-4">Add Seed</h5> -->

    <!-- Row 1 -->
    <div class="row mt-3">

        

        <div class="col-md-4">
            <label for="seedName" class="form-label text-start d-block">
                Seed Name
            </label>

            <input type="text"
                   class="form-control"
                   id="seedName"
                   placeholder="Enter Seed Name">
        </div>
         <div class="col-md-4">
            <label for="seedStatus" class="form-label text-start d-block">
                Seed Status
            </label>

            <input type="text"
                   class="form-control"
                   id="seedStatus"
                   placeholder="Enter Seed Status">
        </div>

        <div class="col-md-4">
            <label for="variety" class="form-label text-start d-block">
                Variety
            </label>

            <input type="text"
                   class="form-control"
                   id="variety"
                   placeholder="Enter Seed Variety">
        </div>

    </div>


    <!-- Row 2 -->
    <div class="row mt-3">

        <div class="col-md-4">
            <label for="seedBrand" class="form-label text-start d-block">
                Seed Brand
            </label>

            <input type="text"
                   class="form-control"
                   id="seedBrand"
                   placeholder="Enter Seed Brand">
        </div>

        <div class="col-md-4">
            <label for="batchNo" class="form-label text-start d-block">
                Batch No
            </label>

            <input type="number"
                   class="form-control"
                   id="batchNo"
                   placeholder="Enter Batch No">
        </div>

        <div class="col-md-4">
            <label for="packSize" class="form-label text-start d-block">
                Pack Size
            </label>

            <input type="text"
                   class="form-control"
                   id="packSize"
                   placeholder="Enter Packing Size">
        </div>

    </div>


    <!-- Row 3 -->
    <div class="row mt-3">

        <div class="col-md-4">
            <label for="quantity" class="form-label text-start d-block">
                Quantity
            </label>

            <input type="text"
                   class="form-control"
                   id="quantity"
                   placeholder="Enter Quantity">
        </div>

        <div class="col-md-4">
            <label for="rate" class="form-label text-start d-block">
                Rate
            </label>

            <input type="number"
                   class="form-control"
                   id="rate"
                   placeholder="Enter Seed Rate">
        </div>

        <div class="col-md-4">
            <label for="netAmount" class="form-label text-start d-block">
                Net Amount
            </label>

            <input type="text"
                   class="form-control"
                   id="netAmount"
                   placeholder="Enter Net Amount">
        </div>

    </div>


    <!-- Row 4 -->
    <div class="row mt-3">

        <div class="col-md-4">
            <label for="dom" class="form-label text-start d-block">
                DOM
            </label>

            <input type="date"
                   class="form-control"
                   id="dom">
        </div>

        <div class="col-md-4">
            <label for="doe" class="form-label text-start d-block">
                DOE
            </label>

            <input type="date"
                   class="form-control"
                   id="doe">
        </div>

        <div class="col-md-4">
            <label for="germination" class="form-label text-start d-block">
                Germination
            </label>

            <input type="number"
                   class="form-control"
                   id="germination"
                   placeholder="Enter Seed Germination">
        </div>

    </div>


    <!-- Row 5 -->
    <div class="row mt-3">

        <div class="col-md-4">
            <label for="purity" class="form-label text-start d-block">
                Purity %
            </label>

            <input type="number"
                   class="form-control"
                   id="purity"
                   placeholder="Enter Seed Purity">
        </div>

       

        <div class="col-md-4">

            <button type="button"
                    class="btn btn-info"
                    style="margin-top: 8%;">
                Upload Seed Image
            </button>

        </div>

    </div>


   <div class="row mt-5">
        <div class="col-4"></div>
        <div class="col-6 d-flex justify-content-end">
             <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    Close
                </button>

                <button type="button"
                        class="btn btn-success ms-1">
                    Save 
                </button>
        </div>
        <div class="col-2 ">
             
        </div>
    </div>

</div>
